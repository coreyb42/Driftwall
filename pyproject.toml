[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftwall"
version = "0.1.0"
description = "Dynamic wallpaper rotator with LLM-based image classification"
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.2",
    "Pillow>=10.0",
    "json-repair>=0.30",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
driftwall = "driftwall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["driftwall*"]
